<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    html,
    body {
      margin: 0;
      background-color: #20202c;
      /* fallback dark */
    }

    :root {
      --bg-color: #20202c;
      /* fallback splash color */
      --test-height: 45px;
      /* Acodex UI tokens (espelha src/styles/designTokens.scss; o splash
         renderiza antes do bundle, por isso os valores ficam inline aqui) */
      --ease-out-soft: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out-soft: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-fast: 140ms;
      --dur-normal: 220ms;
      --dur-slow: 320ms;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --radius-full: 999px;
    }

    body.loading {
      position: relative;
    }

    body.loading #splash {
      display: block;
    }

    #splash {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      inset: 0;
      z-index: 999999;

      background-color: var(--bg-color);
      background-image:
        radial-gradient(
          ellipse 90% 55% at 50% 36%,
          rgba(255, 255, 255, 0.07),
          transparent 70%
        ),
        radial-gradient(
          ellipse 120% 80% at 50% 110%,
          rgba(0, 0, 0, 0.35),
          transparent 60%
        );

      text-align: center;

      /* Disable any possible fade on the splash container itself */
      animation: none !important;
      transition: none !important;
    }

    #splash-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 180px;
      height: 180px;
      margin-top: -100px;
      margin-left: -90px;

      background-image: url("./splash-logo.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 140px;

      filter: drop-shadow(0 10px 32px rgba(0, 0, 0, 0.55));

      animation: splashEnter var(--dur-slow) var(--ease-out-soft) both,
        splashPulse 2.6s var(--ease-in-out-soft) var(--dur-slow) infinite;
    }

    @keyframes splashEnter {
      from {
        opacity: 0;
        transform: scale(0.78);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes splashPulse {
      0% {
        transform: scale(0.965);
        opacity: 0.88;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(0.965);
        opacity: 0.88;
      }
    }

    .splash-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px;
      height: 3px;
      margin-top: 76px;
      margin-left: -75px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .splash-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.85);
      animation: splashBar 1.5s var(--ease-in-out-soft) infinite;
    }

    @keyframes splashBar {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }

    .splash-version {
      position: absolute;
      top: 15px;
      left: 15px;

      color: rgba(255, 255, 255, 0.45);
      font-size: 0.75rem;
      white-space: pre;
      font-family: monospace;
      text-align: left;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius-full);
      padding: 4px 12px;
    }

    .splash-message {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.85rem;
      line-height: 1.4;
      width: 86vw;
      text-align: center;
      animation: splashMsgFade var(--dur-normal) var(--ease-out-soft) both;
    }

    @keyframes splashMsgFade {
      from {
        opacity: 0;
        transform: translate(-50%, 6px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
    #splash-logo,
    .splash-bar-fill,
    .splash-message {
      animation: none;
    }

    .splash-bar-fill {
      left: 30%;
    }
  }
</style>

  <!-- Set theme color BEFORE UI renders -->
  <script>
    (function () {
      var MIN_WEBVIEW_MAJOR = 67;
      var color = localStorage.getItem("__primary_color");
      var bg = color || "#20202c";

      document.documentElement.style.setProperty("--bg-color", bg);
      document.documentElement.style.backgroundColor = bg;
      document.body && (document.body.style.backgroundColor = bg);

      function getWebViewMajor() {
        var match = navigator.userAgent.match(/(?:Chrome|CriOS)\/(\d+)/);
        return match ? Number(match[1]) : 0;
      }

      var pendingStartupMessage = "";
      var hasPendingStartupMessageListener = false;

      function isStartupLoading() {
        return !document.body || document.body.classList.contains("loading");
      }

      function applyStartupMessage() {
        hasPendingStartupMessageListener = false;
        if (document.body && isStartupLoading()) {
          document.body.setAttribute("data-small-msg", pendingStartupMessage);
        }
      }

      function setStartupMessage(message) {
        pendingStartupMessage = message;

        if (document.body) {
          applyStartupMessage();
        } else if (!hasPendingStartupMessageListener) {
          hasPendingStartupMessageListener = true;
          document.addEventListener("DOMContentLoaded", applyStartupMessage, {
            once: true
          });
        }
      }

      var hasES6 = false;
      try {
        hasES6 = !!new Function("return (()=>{})")();
      } catch (e) {}

      if (!hasES6) {
        setStartupMessage(
          "Acodex requires a modern browser. Please update Android System WebView or Chrome."
        );
      }

      window.__ACODE_WEBVIEW_MAJOR__ = getWebViewMajor();
      window.__ACODE_MIN_WEBVIEW_MAJOR__ = MIN_WEBVIEW_MAJOR;

      if (hasES6 &&
        window.__ACODE_WEBVIEW_MAJOR__ &&
        window.__ACODE_WEBVIEW_MAJOR__ < MIN_WEBVIEW_MAJOR
      ) {
        setStartupMessage(
          "Your Android System WebView is old. Update Android System WebView or Chrome if Acodex stays on this screen."
        );
      }

      function isStorageError(reason) {
        if (!reason) return false;
        return (
          reason.name === "FileError" ||
          reason.name === "NotFoundError" ||
          reason.name === "SecurityError" ||
          (typeof window.FileError !== "undefined" &&
            reason instanceof window.FileError)
        );
      }

      function handleStartupError(event) {
        if (!isStartupLoading()) return;
        var message = event && event.message ? event.message : "Startup error";
        setStartupMessage(
          isStorageError(event && event.error)
            ? "Acodex failed to start: storage is unavailable. Try restarting your device, or clearing the app data. " +
                message
            : "Acodex failed to start. Update Android System WebView or Chrome. " +
                message
        );
      }

      function handleStartupRejection(event) {
        if (!isStartupLoading()) return;
        var reason = event && event.reason;
        var message =
          reason && reason.message ? reason.message : "Startup promise failed";
        setStartupMessage(
          isStorageError(reason)
            ? "Acodex failed to start: storage is unavailable. Try restarting your device, or clearing the app data. " +
                message
            : "Acodex failed to start. Update Android System WebView or Chrome. " +
                message
        );
      }

      window.addEventListener("error", handleStartupError);
      window.addEventListener("unhandledrejection", handleStartupRejection);
    })();
  </script>

  <!-- Core Scripts -->
  <script src="cordova.js"></script>

  <script src="./build/boot.js"></script>

  <title>Acodex</title>
</head>

<body class="loading" data-version="" data-small-msg="">
  <div id="splash">
    <div id="splash-logo"></div>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    <div class="splash-version"></div>
    <div class="splash-message"></div>
  </div>

  <wc-page id="root" class="primary"></wc-page>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const splash = document.getElementById("splash");

      function updateSplash() {
        splash.querySelector(".splash-version").textContent =
          document.body.getAttribute("data-version") || "";

        splash.querySelector(".splash-message").textContent =
          document.body.getAttribute("data-small-msg") || "";
      }

      updateSplash();

      new MutationObserver(updateSplash).observe(document.body, {
        attributes: true,
        attributeFilter: ["data-version", "data-small-msg"]
      });
    });
  </script>
</body>

</html>
